*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--serif);font-size:18px;line-height:1.8;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem;text-align:center;}

.links{display:flex;gap:0.8rem;flex-wrap:wrap;justify-content:center;max-width:640px;}
.link{font-family:var(--sans);font-size:0.82rem;color:var(--accent2);text-decoration:none;border:1px solid var(--line);padding:0.6rem 1.1rem;border-radius:3px;transition:border-color 0.2s,color 0.2s;}
.link:hover{border-color:var(--accent2);color:var(--white);}
.link.primary{border-color:var(--accent);color:var(--accent);}
.link.primary:hover{background:rgba(200,169,110,0.08);color:var(--white);}
