# verifica.yml — IDENTIC in toate cele 6 repo-uri norgedan.
# verifica-site.sh [10] compara workflow-urile intre ele: o singura plasa, nu sase.
#
# A doua plasa de siguranta, dupa garda locala (scripts/hooks/pre-push):
# verifica site-ul asa cum e PE GITHUB, independent de masina locala.
# Prinde si ce ocoleste garda: editari facute direct in browser, pe GitHub.
#
# Ruleaza: la fiecare push pe main, in oricare repo; zilnic, doar din hub;
# si la cerere (Actions -> verifica-site -> Run workflow).
# Esec = email automat de la GitHub catre proprietarul contului.
#
# Publicarea (jobul "publica") porneste NUMAI dupa ce "verifica" a trecut:
# un site cu probleme nu ajunge pe GitHub Pages, oricum ar fi ajuns pe GitHub.
# Cere, o singura data per repo: Settings -> Pages -> Source: GitHub Actions.
# Fiecare repo isi publica doar propriul site; verificarea e a site-ului intreg.

name: verifica-site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: read   # [12] citeste sursa publicarii (Actions sau ramura)

jobs:
  verifica:
    # rularea zilnica: o singura data, din hub — nu de sase ori
    if: github.event_name != 'schedule' || github.repository == 'norgedan/norgedan.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { repository: norgedan/norgedan.github.io, path: norgedan.github.io }
      - uses: actions/checkout@v6
        with: { repository: norgedan/corpus, path: corpus }
      - uses: actions/checkout@v6
        with: { repository: norgedan/corpus2, path: corpus2 }
      - uses: actions/checkout@v6
        with: { repository: norgedan/opera, path: opera }
      - uses: actions/checkout@v6
        with: { repository: norgedan/limba, path: limba }
      - uses: actions/checkout@v6
        with: { repository: norgedan/limba-ro-final, path: limba-ro-final }
      # [14] NO: Bibelen 1930, text public, fixat pe commit; scriptul ii verifica
      # amprenta (cksum).  RO 1688 sta doar local, deci in CI se confrunta doar NO.
      - name: Bibelen 1930 pentru [14] (scrollmapper, commit fixat)
        run: |
          mkdir -p biblii
          curl -fsSL --retry 3 -o biblii/Norsk-1930.json \
            https://raw.githubusercontent.com/scrollmapper/bible_databases/e1b254cef86d0e65b1a5d1a94b8b112d0f296a2c/formats/json/Norsk.json
      # Cursa dintre repo-uri (pas53): un pas care atinge doua repo-uri pleaca in
      # doua push-uri, la un minut distanta.  CI-ul primului vede, intre timp,
      # fratele inca nesincronizat (asa au picat corpus #42 si #43, 19 oct).
      # De aceea: pana la 3 incercari, la 2 minute; inainte de fiecare reluare,
      # fratii se aduc din nou de pe GitHub.  Repo-ul propriu ramane fix pe
      # commit-ul push-ului: ce se verifica e exact ce se publica.
      - name: verifica-site.sh --ci (reluat daca un repo frate e in mijlocul push-ului)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          EU=${GITHUB_REPOSITORY#*/}
          for i in 1 2 3; do
            sh norgedan.github.io/scripts/verifica-site.sh --ci && exit 0
            [ "$i" -lt 3 ] || exit 1
            echo "::notice::verificarea a picat (incercarea $i din 3) - reiau peste 2 minute, cu repo-urile surori aduse din nou"
            sleep 120
            for r in norgedan.github.io corpus corpus2 opera limba limba-ro-final; do
              [ "$r" = "$EU" ] && continue
              git -C "$r" fetch -q --depth 1 origin main && git -C "$r" reset -q --hard FETCH_HEAD
            done
          done

  publica:
    needs: verifica
    # la push si la cerere; rularea zilnica doar verifica, nu republica
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicare.outputs.page_url }}
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with: { path: repo }
      - name: arborele publicat (fara .git si .github, ca pana acum)
        run: mkdir _site && tar -C repo --exclude=./.git --exclude=./.github -cf - . | tar -C _site -xf -
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - id: publicare
        uses: actions/deploy-pages@v5
